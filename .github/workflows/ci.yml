name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The Tauri build script expects the frontend output folder to exist.
      - name: Create placeholder frontend output
        run: mkdir -p apps/desktop/dist

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features oxidizeesp/mock-hardware --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Check generated TypeScript bindings
        run: |
          if [ -n "$(git status --porcelain apps/desktop/src/lib/bindings)" ]; then
            echo "::error::TypeScript bindings are out of date. Run 'cargo test --workspace' and commit the changes."
            git status --porcelain apps/desktop/src/lib/bindings
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
