[workspace]
resolver = "3"
members = ["crates/oxidizeesp-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BTFLV/OxidizeESP"

[workspace.dependencies]
oxidizeesp-core = { path = "crates/oxidizeesp-core" }
espflash = { version = "4.6.0", default-features = false, features = ["serialport"] }
esp-idf-part = "0.6.0"
serialport = "4.10"
addr2line = { version = "0.25", default-features = false, features = ["std", "rustc-demangle", "cpp_demangle"] }
object = "0.39"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
md-5 = "0.11"
log = "0.4"
regex = "1.11"
tempfile = "3.20"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
ts-rs = { version = "12.0", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1.18", features = ["v4"] }
tokio = { version = "1.47", features = ["rt", "sync", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
