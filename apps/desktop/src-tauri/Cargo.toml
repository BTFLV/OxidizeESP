[package]
name = "oxidizeesp"
description = "Desktop application for flashing, monitoring and managing Espressif microcontrollers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "oxidizeesp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Replace real hardware with simulated devices. For development only.
mock-hardware = ["oxidizeesp-core/mock"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
oxidizeesp-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-window-state = "2.5"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
ts-rs.workspace = true
md-5.workspace = true

[lints]
workspace = true
